# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Values marked "sync: false" are asked for in the dashboard (they're secrets,
# never committed). See README -> "Deploy with a permanent URL".
services:
  - type: web
    name: forward-it
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: GROQ_API_KEY
        sync: false
      # Meta WhatsApp Cloud API (real two-way WhatsApp). See README.
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_DISPLAY_NUMBER
        sync: false
      # Twilio: optional once Meta works; set WHATSAPP_MODE=off to switch it off.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # Your test number from Twilio's "Try out WhatsApp" page (newer accounts: +1 737 250 8034).
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+17372508034
      - key: TWILIO_SANDBOX_CODE
        sync: false
